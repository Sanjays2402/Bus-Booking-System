name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root deps
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install server deps
        working-directory: server
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install client deps
        working-directory: client
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Rebuild better-sqlite3 (native)
        working-directory: server
        run: npm rebuild better-sqlite3

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Test server
        working-directory: server
        run: npm test

      - name: Enforce client bundle-size budget
        working-directory: client
        run: node ../scripts/check-bundle-size.mjs

  e2e:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root deps
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install server deps
        working-directory: server
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Install client deps
        working-directory: client
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Rebuild better-sqlite3 (native)
        working-directory: server
        run: npm rebuild better-sqlite3

      - name: Seed demo data
        working-directory: server
        run: npm run seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start server
        working-directory: server
        run: |
          (npm run dev &) && sleep 5

      - name: Start client (preview build)
        working-directory: client
        run: |
          npm run build
          (npx vite preview --port 5173 --host 127.0.0.1 &) && sleep 4

      - name: Wait for app
        run: |
          for i in {1..30}; do
            curl -sf http://127.0.0.1:5173/ && exit 0
            sleep 1
          done
          echo "Client did not become ready"; exit 1

      - name: Run Playwright tests
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
